name: FEELCYCLE Cancel Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # 15分ごとに実行
  workflow_dispatch:           # 手動実行ボタンも使える

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        env:
          FEELCYCLE_EMAIL:    ${{ secrets.FEELCYCLE_EMAIL }}
          FEELCYCLE_PASSWORD: ${{ secrets.FEELCYCLE_PASSWORD }}
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
